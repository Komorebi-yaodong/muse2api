services:
  muse2api:
    build: .
    restart: always
    ports:
      - "18610:18610"
    environment:
      - MUSE2API_KEY=${MUSE2API_KEY:-}
      - MUSE2API_PUBLIC_BASE=${CLOADY_PRIMARY_URL}
      - MUSE2API_IMAGE_TIMEOUT=240
      - MUSE2API_VIDEO_TIMEOUT=600
      - MUSE2API_CHAT_TIMEOUT=300
    volumes:
      - muse2api_data:/app/data
    shm_size: '2gb'

volumes:
  muse2api_data:
